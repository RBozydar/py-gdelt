name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:  # Allow manual trigger

# Cancel in-progress runs when a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache uv dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Run ruff check
        run: uvx ruff check .

      - name: Run ruff format check
        run: uvx ruff format --check .

  typecheck:
    name: Type Check (MyPy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache uv dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Cache mypy
        uses: actions/cache@v5
        with:
          path: .mypy_cache
          key: ${{ runner.os }}-mypy-${{ hashFiles('**/pyproject.toml') }}-${{ hashFiles('**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-mypy-${{ hashFiles('**/pyproject.toml') }}-
            ${{ runner.os }}-mypy-

      - name: Run mypy
        run: uv run mypy src/py_gdelt

  doc-coverage:
    name: Documentation Coverage
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.interrogate.outputs.coverage }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache uv dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run interrogate
        id: interrogate
        run: |
          OUTPUT=$(uv run interrogate src/py_gdelt 2>&1)
          echo "$OUTPUT"
          COVERAGE=$(echo "$OUTPUT" | grep "RESULT:" | grep -oP 'actual: \K[0-9.]+')
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "### 📝 Docstring Coverage: ${COVERAGE}%" >> $GITHUB_STEP_SUMMARY

      - name: Run pydoclint
        run: uv run pydoclint --style=google src/py_gdelt

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache uv dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-py${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-py${{ matrix.python-version }}-
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests with coverage
        run: uv run pytest -m "not integration" --cov=src/py_gdelt --cov-report=xml --cov-report=term tests/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          file: ./coverage.xml
          flags: py${{ matrix.python-version }}
          name: Python ${{ matrix.python-version }}
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Check coverage threshold
        run: |
          uv run coverage report --fail-under=80

      - name: Security audit
        run: |
          uv run pip-audit --skip-editable \
            --ignore-vuln PYSEC-2022-42969 \
            --ignore-vuln CVE-2026-22701 \
            --ignore-vuln CVE-2026-23490 \
            --ignore-vuln CVE-2026-22702 \
            --ignore-vuln CVE-2026-0994
        # Ignored CVEs:
        # - PYSEC-2022-42969: disputed/withdrawn CVE in py (interrogate dep)
        # - CVE-2026-22701: filelock (transitive dep via uv/virtualenv)
        # - CVE-2026-23490: pyasn1 (transitive dep)
        # - CVE-2026-22702: virtualenv (transitive dep)
        # - CVE-2026-0994: protobuf (transitive dep via google-cloud-bigquery, no fix available yet)

  minimal-install:
    name: Minimal Install Import Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build wheel
        run: uv build --wheel

      - name: Create clean environment
        run: python -m venv .minimal-venv

      - name: Install wheel without extras
        run: |
          .minimal-venv/bin/python -m pip install --upgrade pip
          .minimal-venv/bin/python -m pip install dist/*.whl

      - name: Verify base imports without BigQuery extra
        run: |
          .minimal-venv/bin/python - <<'PY'
          import asyncio
          import importlib.abc
          import sys

          for module_name in list(sys.modules):
              if module_name == "google" or module_name.startswith("google."):
                  del sys.modules[module_name]

          class BlockGoogleImports(importlib.abc.MetaPathFinder):
              def find_spec(self, fullname, path=None, target=None):
                  if fullname == "google" or fullname.startswith("google."):
                      raise ImportError(f"blocked optional Google import: {fullname}")
                  return None

          sys.meta_path.insert(0, BlockGoogleImports())

          import py_gdelt
          from py_gdelt import GDELTClient, GDELTSettings
          from py_gdelt.endpoints import DocEndpoint
          from py_gdelt.sources import DataFetcher, FileSource

          async def main():
              async with GDELTClient(settings=GDELTSettings()) as client:
                  assert isinstance(client.doc, DocEndpoint)

          asyncio.run(main())
          assert py_gdelt.__version__
          assert DataFetcher is not None
          assert FileSource is not None

          try:
              from py_gdelt.sources import BigQuerySource
          except ImportError as exc:
              message = str(exc)
              assert "gdelt-py[bigquery]" in message
          else:
              raise AssertionError(f"expected ImportError, got {BigQuerySource!r}")
          PY

  # Summary job that depends on all checks
  ci-success:
    name: All CI Checks Passed
    runs-on: ubuntu-latest
    needs: [lint, typecheck, doc-coverage, test, minimal-install]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          if [[ "${{ needs.lint.result }}" != "success" || \
                "${{ needs.typecheck.result }}" != "success" || \
                "${{ needs.doc-coverage.result }}" != "success" || \
                "${{ needs.test.result }}" != "success" || \
                "${{ needs.minimal-install.result }}" != "success" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI checks passed successfully!"

      - name: Post success summary
        run: |
          echo "## ✅ CI Success" >> $GITHUB_STEP_SUMMARY
          echo "All checks passed:" >> $GITHUB_STEP_SUMMARY
          echo "- Linting (Ruff): ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Type Checking (MyPy): ${{ needs.typecheck.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Documentation Coverage: ${{ needs.doc-coverage.result }} (${{ needs.doc-coverage.outputs.coverage }}%)" >> $GITHUB_STEP_SUMMARY
          echo "- Tests (Multiple Python versions): ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Minimal Install Import Smoke: ${{ needs.minimal-install.result }}" >> $GITHUB_STEP_SUMMARY
